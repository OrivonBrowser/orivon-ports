<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Lounge</title>
  <link rel="icon" href="install/public/favicon.ico">
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <main id="app">
    <header class="bar">
      <h1>The Lounge</h1>
      <p id="status" role="status" aria-live="polite">Starting...</p>
      <button id="restart" type="button" hidden>Restart the server</button>
      <button id="reload" type="button" hidden>Reload</button>
    </header>

    <ul id="notices" aria-label="Notices" aria-live="polite"></ul>

    <section id="setup" aria-labelledby="setup-title" hidden>
      <h2 id="setup-title">Create your account</h2>
      <p>The Lounge keeps its accounts on this computer, in this app's files. Use this name and password to sign in on the next screen.</p>
      <form id="setup-form" novalidate>
        <label for="account-name">User name</label>
        <input id="account-name" name="name" autocomplete="username" required maxlength="64">
        <label for="account-password">Password</label>
        <input id="account-password" name="password" type="password" autocomplete="new-password" required>
        <label for="account-confirm">Password again</label>
        <input id="account-confirm" name="confirm" type="password" autocomplete="new-password" required>
        <label class="check"><input id="account-history" name="history" type="checkbox" checked> Keep message history</label>
        <ul id="setup-errors" role="alert"></ul>
        <button id="setup-submit" type="submit">Create account</button>
      </form>
    </section>

    <div id="stage"></div>

    <details id="log">
      <summary>Server log</summary>
      <pre id="log-text" tabindex="0"></pre>
    </details>
  </main>
  <script src="launcher.js" defer></script>
</body>
</html>
