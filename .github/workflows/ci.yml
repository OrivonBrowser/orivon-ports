name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Seven gates. check:no-upstream is the one that matters most: it reads
      # what git tracks, so it is the thing standing between this repository
      # and somebody else's licensed source appearing in it.
      - run: npm run check

  # Building a port clones somebody's repository and runs their toolchain, which
  # takes minutes and needs the network. That does not belong on every push, and
  # a green `check` job does not claim the build works -- only that the recipe is
  # well-formed. Run this before trusting a recipe change.
  build-ports:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # No `corepack enable`: FreeTube pins no packageManager, so corepack
      # resolves pnpm to whatever is newest and downloads it mid-build. The
      # runner's own pnpm is the reproducible one.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      # `build`, not `run`: it fetches, builds and prepares, then stops. A
      # backgrounded server would die with the step that started it anyway.
      - run: node src/cli.ts build freetube --rebuild
      - run: test -f out/freetube/static/index.html
      - run: test -f out/freetube/static/.well-known/orivon.json
      - run: test -f out/freetube/static/orivon/ft-electron-bridge.js
      # The manifest's assets list and the ddoc file describe the tree exactly.
      - run: node src/cli.ts hash out/freetube/static --check
